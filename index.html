<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAIN Clinic Day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* Layout idea: soft editorial illustration on top, one calm task card underneath. Single theme by choice. */
  /* --shadow is the one elevation used everywhere */
:root{
  color-scheme:light;
  --shadow:0 8px 24px rgba(27,42,74,.10); --bg:#F1F6F4; --surface:#FFFFFF; --ink:#1B2A4A; --muted:#4F5D78; --line:#D5E3DF;
  --accent:#1F8A8A; --sun:#FFC857; --rose:#F7A8B8; --sky:#BFE6F5;
  --good:#1E7A4C; --warn:#8A5A00; --bad:#B23A34;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F1F6F4;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:22px 16px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(46px,12vw,88px);font-weight:800;letter-spacing:-0.03em}
h2{font-size:30px;font-weight:800;letter-spacing:-0.02em}
h3{font-size:20px;font-weight:800}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)} .small{font-size:14.5px}
.eyebrow{font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.draft{font-size:14px;color:var(--muted);border:2px dashed var(--line);border-radius:10px;padding:8px 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:0 12px 28px rgba(27,42,74,.16)}
.btn:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(27,42,74,.12)}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.scene{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.appear{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:pop .4s ease both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

/* clinic list */
.slot{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-top:2px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.slot:first-child{border-top:0}
.slot .time{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.slot.locked{color:var(--muted)} .slot.locked .time{font-weight:500}
.slot.open{background:#FFF1CC}
.slot.open:hover .go{transform:translateX(4px)}
.go{font-weight:700;transition:transform .15s}
.tag{font-size:13px;border:2px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.sheet{padding:0;overflow:hidden;gap:0}

/* chart */
.chart-head{background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.chart-head .big{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{background:#F7FAF9;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-weight:700;display:flex;justify-content:space-between;gap:8px;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile.read{background:var(--surface)}
.tile.on{background:#E3F3F8;border-color:var(--accent)}
.detail{border:1px solid var(--line);border-radius:12px;padding:14px;background:#E3F3F8;display:grid;gap:8px}
.field{display:grid;grid-template-columns:130px 1fr;gap:10px}
.field span:first-child{color:var(--muted)}
mark{background:var(--sun);color:var(--ink);padding:0 4px;border-radius:4px;font-weight:700}
.notes{background:#FFF6D6;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.notes>strong,.notes>.muted{flex-basis:100%}
.note{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;margin:0;text-align:left}

/* chart */
.ehr{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.ehr-banner{background:var(--ink);color:#fff;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 18px;font-size:15px;font-variant-numeric:tabular-nums}
.ehr-banner .nm{grid-column:1/-1;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:.01em}
.ehr-banner small{display:block;opacity:.7;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ehr-body{display:grid;grid-template-columns:150px 1fr}
.tabs{display:flex;flex-direction:column;background:#EEF3F2;border-right:1px solid var(--line)}
.tab{background:none;border:0;border-left:4px solid transparent;text-align:left;padding:11px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);border-left-color:var(--accent);color:var(--accent)}
.sheetbody{padding:12px 14px;display:grid;gap:14px;font-size:15px;min-height:330px;align-content:start;overflow-x:auto}
.grp h4{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.line{display:grid;grid-template-columns:minmax(110px,170px) 1fr 20px;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #EEF3F2;padding:7px 4px;font-size:15px;align-items:start}
.line.free{grid-template-columns:1fr 20px}
.line.cols{grid-template-columns:minmax(120px,1.7fr) repeat(var(--n),minmax(54px,1fr)) 20px;font-variant-numeric:tabular-nums}
button.line:hover{background:#F3FAF8}
.line.pinned{background:#FFF6D6}
.line .k,.thead{color:var(--muted)}
.thead{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.line .pin{color:var(--accent);font-weight:700;text-align:right}
button.note{cursor:pointer}
.finds{list-style:none;padding:0}
.finds .ok strong{color:var(--good)} .finds .miss strong{color:var(--bad)}
@media (max-width:560px){.ehr-body{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.tab{border-left:0;border-bottom:4px solid transparent}.tab[aria-selected="true"]{border-bottom-color:var(--accent)}.line{grid-template-columns:1fr 20px}.line .k{grid-column:1}.line:not(.cols):not(.free) span:nth-child(2){grid-column:1}.line:not(.cols):not(.free) .pin{grid-row:1;grid-column:2}}

/* consultation */
.meter{background:var(--surface);border-top:1px solid var(--line);padding:8px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.meter .label{display:flex;gap:8px;font-size:15px}
.track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .5s ease}
.fill.low{background:var(--bad)} .fill.high{background:var(--good)}
.speech{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin:0 18px;position:relative;z-index:1;font-size:19px;font-weight:700;box-shadow:var(--shadow)}
.speech .by{display:block;font-size:13px;color:var(--muted);font-weight:400}
.narr{color:var(--muted);font-style:italic}
.you{background:#E3F3F8;border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:10px 14px;align-self:flex-end;max-width:92%}
.you .by{display:block;font-size:13px;color:var(--muted)}
.options{display:grid;gap:10px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-align:left;box-shadow:0 3px 10px rgba(27,42,74,.08);transition:transform .1s,box-shadow .1s,background .1s}
.opt:hover{background:#F3FAF8;border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;border:2px solid currentColor;background:var(--surface)}
.chip.up{color:var(--good)} .chip.same{color:var(--warn)} .chip.down{color:var(--bad)}
.why{border-left:4px solid var(--sun);padding:2px 0 2px 12px}

/* label task */
.labelmock{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px 14px;display:grid;gap:6px;max-width:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.drop{border:2px dashed var(--accent);border-radius:8px;min-height:44px;display:grid;place-items:center;font-weight:700;color:var(--muted);background:#F1F6F4}
.drop.done{border-style:solid;color:var(--ink);background:var(--sun);font-size:19px}
.drag{touch-action:none;user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 3px 10px rgba(27,42,74,.08);cursor:grab}
.drag.moving{cursor:grabbing;box-shadow:8px 8px 0 rgba(27,42,74,.35);position:relative;z-index:5}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* record task */
.rec{display:grid;gap:8px;border-top:2px solid var(--line);padding-top:12px}
.rec:first-of-type{border-top:0;padding-top:0}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:6px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg .ask{background:#FDE8EE;margin-left:auto}
.answer{background:#FDE8EE;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;align-self:start;justify-self:start}
.envelope{border:1px solid var(--line);border-radius:8px;background:#FFF6D6;padding:14px 16px;max-width:320px;position:relative}
.envelope:before{content:"";position:absolute;top:10px;right:12px;width:30px;height:36px;border:1px solid var(--line);background:var(--rose);border-radius:3px}
.envelope strong{font-size:19px;display:block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.card.high{background:#DFF3E6} .card.mid{background:#FFF6D6} .card.low{background:#FBE3E0}
ul{margin:0;padding-left:20px;display:grid;gap:6px}
@media (max-width:480px){
  .slot{grid-template-columns:58px 1fr} .slot .end{grid-column:2}
  .field{grid-template-columns:1fr;gap:0}
  .speech{margin:0 8px;font-size:17px}
  .seg .ask{margin-left:0}
}

/* structure: title, map, clinics */
main{--clinic:#E0A526}
.eyebrow{border-left:4px solid var(--clinic);padding-left:8px}
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:6vh 0 4vh}
.map>.eyebrow{border:0;padding:0}
.lead{font-size:20px}
.btn.big{font-size:20px;padding:15px 36px}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:4px;gap:4px}
.switch button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;font-size:15px}
.switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
.plain{background:none;border:0;padding:0;text-align:left;align-self:flex-start;line-height:0}
.link{color:var(--accent);font-weight:700;line-height:1.5}
.between{justify-content:space-between}
.map{background:#DCEBE7;border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:0}
.map>.eyebrow{align-self:flex-start;margin-bottom:10px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.room{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;box-shadow:var(--shadow);transition:transform .15s;border-top:5px solid var(--c)}
.room:hover{transform:translateY(-3px)}
.room.dev,.room.locked{background:#F7FAF9;box-shadow:none;color:var(--muted)}
.room strong{font-size:16px;line-height:1.25}
.room.main{flex-direction:row;align-items:center;gap:16px;width:min(100%,460px);background:var(--t);border:2px solid var(--ink);padding:14px 18px}
.maintext{display:flex;flex-direction:column;gap:6px}
.room .big{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em}
.corridor{width:76%;height:34px;border-top:5px dotted var(--accent);margin-top:14px}
.corridor:after,.stub{content:"";display:block;width:0;height:34px;border-left:5px dotted var(--accent);margin:0 auto}
.stub{height:22px}
.here{background:var(--accent);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:7px 18px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--muted)}
.pill.req{background:var(--ink);color:#fff;border-color:var(--ink)}
.strip{background:#F3FAF8;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ph{background:#FFF1CC;border:1px dashed #C99A1E;border-radius:6px;padding:1px 7px;font-size:13.5px;color:#5C4500;display:inline-block}
.ph b{text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
.ph.block{display:block;padding:8px 12px;max-width:none}
.summary{white-space:pre-wrap;font-family:var(--body);font-size:16px;margin:0}
@media (max-width:620px){.rooms{grid-template-columns:1fr 1fr}.corridor{width:50%}}
.gamename{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;color:var(--accent);margin-top:6px}
.title h1{letter-spacing:.02em}
.slot.open.done{background:#EAF5EC}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .labelmock{max-width:none}
.opt.check[aria-pressed="true"]{border-color:var(--accent);background:#E3F3F8}
.slipnote{background:#FBE3E0;border-left:4px solid var(--bad);padding:10px 12px;border-radius:0 10px 10px 0;max-width:none}
@media (max-width:480px){.pair{grid-template-columns:1fr}}
.gamename{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.01em;color:var(--accent);margin-top:6px}
.title h1{letter-spacing:.02em}
.slot.open.done{background:#EAF5EC}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .labelmock{max-width:none}
.opt.check[aria-pressed="true"]{border-color:var(--accent);background:#E3F3F8}
.slipnote{background:#FBE3E0;border-left:4px solid var(--bad);padding:10px 12px;border-radius:0 10px 10px 0;max-width:none}
.timebar,.prog{display:grid;gap:6px}
.timebar .fill,.prog .fill{background:var(--clinic)}
.how{margin:0;padding-left:22px;display:grid;gap:10px}
@media (max-width:480px){.pair{grid-template-columns:1fr}}

/* v6 look: navy shell, palette taken from the logo, scenes that glow */
:root{--bg:#0F1830;--accent:#5BCEFA;--rose:#F5A9B8}
body{background:radial-gradient(1100px 620px at 85% -8%,rgba(245,169,184,.20),transparent 62%),radial-gradient(900px 560px at -5% 5%,rgba(91,206,250,.20),transparent 60%),var(--bg);background-attachment:fixed;color:#EAF0FB}
main{--muted:#A9B6D3;--link:#7FDAFB;color:#EAF0FB}
.panel,.card,.ehr,.notes,.speech,.strip,.room,.envelope,.labelmock,.opt,.tile,.you,.answer,.summary,.meter,.detail{--muted:#4F5D78;--link:#0B6A8C;color:#1B2A4A}
.link,.go{color:var(--link)}
.tab[aria-selected="true"],.line .pin{color:var(--link)}
.btn{background:var(--accent);color:#0E1830;box-shadow:0 8px 22px rgba(91,206,250,.28)}
.btn.ghost{background:transparent;color:var(--link);border:1.5px solid currentColor;box-shadow:none}
.btn.ghost[aria-pressed="true"]{background:rgba(127,218,251,.16)}
.scene{border:0;border-radius:22px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 26px 70px rgba(91,206,250,.24)}
.meter{border-top:0}
.meter .track{background:#D5E3DF}
.track{background:rgba(255,255,255,.18)}
.card .track,.panel .track{background:#D5E3DF}
.map{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.here{background:var(--rose);color:#0F1830}
.room.dev,.room.locked{background:#E7ECF4}
.switch{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.switch button{color:#EAF0FB}
.switch button[aria-pressed="true"]{background:#fff;color:#0F1830}
.draft{border-color:rgba(255,255,255,.28)}
.drop{background:#F1F6F4}
.title h1{font-size:clamp(84px,22vw,150px);line-height:.9;background:linear-gradient(100deg,#5BCEFA 5%,#F5A9B8 45%,#FFFFFF 62%,#F5A9B8 80%,#5BCEFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.gamename{color:var(--rose)}
.card .card{box-shadow:none}
details.card>summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:19px}
details.card[open]>summary{margin-bottom:6px}
.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.art{position:relative}
.hot{position:absolute;left:7%;top:80%;width:46px;height:46px;border-radius:50%;border:3px solid #E0527A;background:rgba(245,169,184,.35);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.blink{opacity:0;animation:blink 5.5s infinite}
@keyframes blink{0%,95.5%,100%{opacity:0}96.5%,98.5%{opacity:1}}
.breathe{animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2.5px)}}
#app.enter{animation:rise .34s ease both}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.line{grid-template-columns:minmax(110px,170px) 1fr auto}
.line.free{grid-template-columns:1fr auto}
.line.cols{grid-template-columns:minmax(120px,1.7fr) repeat(var(--n),minmax(54px,1fr)) auto}
.line .pin{font-size:12.5px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:700}
.thead span:last-child{visibility:hidden}
@media (max-width:640px){.scene.pin{position:sticky;top:6px;z-index:4}.line{grid-template-columns:1fr auto}.line.cols{min-width:470px}}

/* facilitator mode */
.btn.alt{background:var(--rose);box-shadow:0 8px 22px rgba(245,169,184,.28)}
main.fac{max-width:1000px;font-size:19px}
main.fac .opt{font-size:20px}
main.fac .speech{font-size:23px}
.voterow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
.vote{border:1.5px solid var(--line);border-radius:14px;background:#fff;color:#1B2A4A;font-weight:700;padding:0 14px;min-width:104px}
.facask{display:grid;gap:12px}
.facq{background:#EAF7FD;border-left:5px solid #5BCEFA;padding:10px 14px;border-radius:0 12px 12px 0;color:#1B2A4A;max-width:none}
details.whyd>summary{cursor:pointer;font-weight:700;color:var(--link)}
.phase{display:flex;gap:8px;flex-wrap:wrap}
.phase span{padding:6px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);font-weight:700;font-size:15px}
.phase .on{background:#fff;color:#0F1830;border-color:#fff}
.title{padding:1vh 0 3vh;gap:11px}
.title h1{font-size:clamp(76px,17vw,124px)}
.ribbon{background:#FFC857;color:#0F1830;font-weight:700;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:6px 18px;max-width:none}
.faces{display:flex;justify-content:center;margin-top:4px}
.face{width:92px;height:92px;border-radius:50%;overflow:hidden;border:4px solid #fff;margin-left:-16px;box-shadow:0 10px 26px rgba(3,8,24,.45)}
.face:first-child{margin-left:0}
.face svg{display:block;width:100%;height:100%}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:660px;margin-top:6px}

@media (max-width:560px){.modes{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
